<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WordSeek panda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eae4ff"/>
      <stop offset="1" stop-color="#ffe4f2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- ears -->
  <circle cx="21" cy="21" r="8" fill="#2f2b3a"/>
  <circle cx="43" cy="21" r="8" fill="#2f2b3a"/>
  <!-- head -->
  <ellipse cx="32" cy="35" rx="21" ry="19" fill="#fff"/>
  <!-- eye patches -->
  <ellipse cx="24" cy="33" rx="6" ry="8" fill="#2f2b3a" transform="rotate(-16 24 33)"/>
  <ellipse cx="40" cy="33" rx="6" ry="8" fill="#2f2b3a" transform="rotate(16 40 33)"/>
  <!-- eyes -->
  <circle cx="24.5" cy="34" r="2.6" fill="#fff"/>
  <circle cx="39.5" cy="34" r="2.6" fill="#fff"/>
  <!-- nose + cheeks -->
  <ellipse cx="32" cy="42" rx="3" ry="2.2" fill="#2f2b3a"/>
  <circle cx="19" cy="41" r="3.2" fill="#ff9ec4" opacity=".55"/>
  <circle cx="45" cy="41" r="3.2" fill="#ff9ec4" opacity=".55"/>
</svg>
