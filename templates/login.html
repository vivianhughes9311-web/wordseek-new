<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ff">
  <meta name="color-scheme" content="light">
  <title>WordSeek — Dashboard Login</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-lav"></span>
    <span class="blob blob-sky"></span>
    <span class="blob blob-mint"></span>
    <span class="blob blob-peach"></span>
  </div>

  <div class="login-wrap">
    <form class="login-card card" method="post" action="/login{{ '?next=' + request.args.get('next') if request.args.get('next') else '' }}">
      <div class="login-panda" aria-hidden="true">
        <svg viewBox="0 0 48 48" class="brand-panda">
          <circle cx="15" cy="14" r="6.5" fill="#2f2b3a"/><circle cx="33" cy="14" r="6.5" fill="#2f2b3a"/>
          <ellipse cx="24" cy="26" rx="16" ry="14.5" fill="#fff"/>
          <ellipse cx="18" cy="24" rx="4.4" ry="6" fill="#2f2b3a" transform="rotate(-16 18 24)"/>
          <ellipse cx="30" cy="24" rx="4.4" ry="6" fill="#2f2b3a" transform="rotate(16 30 24)"/>
          <circle cx="18.5" cy="25" r="1.9" fill="#fff"/><circle cx="29.5" cy="25" r="1.9" fill="#fff"/>
          <ellipse cx="24" cy="31" rx="2.3" ry="1.7" fill="#2f2b3a"/>
          <circle cx="13.5" cy="30" r="2.4" fill="#ff9ec4" opacity=".55"/><circle cx="34.5" cy="30" r="2.4" fill="#ff9ec4" opacity=".55"/>
        </svg>
      </div>
      <h1 class="login-title">Dashboard access</h1>
      <p class="login-sub">Enter the dashboard password to control the Telegram monitor.</p>

      {% if not password_set %}
        <p class="login-warn">⚠️ No <code>DASHBOARD_PASSWORD</code> is set on the server. Set it in your environment variables to enable access.</p>
      {% endif %}
      {% if error %}
        <p class="login-error" role="alert">{{ error }}</p>
      {% endif %}

      <label class="visually-hidden" for="password">Dashboard password</label>
      <input id="password" class="login-input" type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus {{ 'disabled' if not password_set }}>
      <button class="login-btn" type="submit" {{ 'disabled' if not password_set }}>Unlock dashboard</button>

      <a class="login-back" href="/">← Back to the solver</a>
    </form>
  </div>
</body>
</html>
