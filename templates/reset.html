<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ff">
  <meta name="color-scheme" content="light">
  <title>WordSeek — Reset password</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-lav"></span><span class="blob blob-sky"></span>
    <span class="blob blob-mint"></span><span class="blob blob-peach"></span>
  </div>
  <div class="login-wrap">
    {% if invalid %}
      <div class="login-card card">
        <h1 class="login-title">Link expired</h1>
        <p class="login-sub">This reset link is invalid or has expired.</p>
        <a class="login-back" href="/forgot">Request a new one</a>
      </div>
    {% else %}
      <form class="login-card card" method="post" action="/reset/{{ token }}">
        <h1 class="login-title">Choose a new password</h1>
        <p class="login-sub">At least 8 characters, with letters and numbers.</p>
        {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
        <label class="fld-label" for="password">New password</label>
        <input id="password" class="login-input" name="password" type="password" placeholder="new password" minlength="8" autocomplete="new-password" required autofocus>
        <label class="fld-label" for="confirm">Confirm password</label>
        <input id="confirm" class="login-input" name="confirm" type="password" placeholder="repeat password" autocomplete="new-password" required>
        <button class="login-btn" type="submit">Update password</button>
        <a class="login-back" href="/login">← Back to sign in</a>
      </form>
    {% endif %}
  </div>
</body>
</html>
